name: Build FitHub APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_FITHUB_DOWNLOAD_URL: ${{ vars.EXPO_PUBLIC_FITHUB_DOWNLOAD_URL }}
      CI: 1

    steps:
      - name: Checkout FitHub source
        uses: actions/checkout@v4

      - name: Use Node 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Check required app secrets
        run: |
          test -n "$EXPO_PUBLIC_SUPABASE_URL" || (echo "Missing EXPO_PUBLIC_SUPABASE_URL GitHub secret" && exit 1)
          test -n "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || (echo "Missing EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY GitHub secret" && exit 1)

      - name: Install dependencies
        run: npm ci

      - name: Show installed versions
        run: |
          node --version
          npm --version
          npx expo --version

      - name: Type-check application
        run: npm run typecheck

      - name: Audit exercise visuals
        run: npm run audit:exercise-visuals

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Configure stable resource compilation
        run: |
          cat >> android/gradle.properties <<'EOF'
          org.gradle.workers.max=1
          android.enablePngCrunchInReleaseBuilds=false
          EOF

      - name: Verify Android autolinking
        run: npx expo-modules-autolinking resolve --platform android > /dev/null

      - name: Build standalone release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --max-workers=1 --stacktrace --info

      - name: Copy APK
        run: cp android/app/build/outputs/apk/release/app-release.apk FitHub.apk

      - name: Upload FitHub APK
        uses: actions/upload-artifact@v4
        with:
          name: FitHub-APK
          path: FitHub.apk
          if-no-files-found: error
          retention-days: 14
